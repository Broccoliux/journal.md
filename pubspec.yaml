name: journal_md
description: "journal.md — a local-first personal and project journal."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # Markdown abstract syntax tree only. Rendering is ours so code blocks,
  # tables and locally stored images can be presented exactly as designed.
  markdown: any
  # Small document store. Runs on IndexedDB in the browser and in memory in tests.
  sembast: any
  sembast_web: any
  # ZIP read/write for the portable markdown export/import format.
  archive: any
  # Browser APIs (files, blobs, object URLs) from the official Dart interop layer.
  web: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
